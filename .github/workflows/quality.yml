name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validasi konten
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: aislop (quality gate)
        uses: scanaislop/aislop@v1
        with:
          version: latest
