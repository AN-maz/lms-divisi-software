version: 1
engines:
  format: true
  lint: true
  code-quality: true
  ai-slop: true
  architecture: true
  security: true
quality:
  # React page component memang panjang; batas longgar, bukan 80 (nilai strict).
  maxFunctionLoc: 300
  maxFileLoc: 500
  maxNesting: 6
  maxParams: 6
lint:
  # Project ini JavaScript, bukan TypeScript -> typecheck dimatikan.
  typecheck: false
  expoDoctor: false
security:
  audit: true
  auditTimeout: 25000
scoring:
  weights:
    format: 0.3
    lint: 0.6
    code-quality: 0.8
    ai-slop: 1
    architecture: 1
    security: 1.5
  thresholds:
    good: 75
    ok: 50
  smoothing: 5
  maxPerRule: 40
ci:
  failBelow: 80
  format: json
telemetry:
  enabled: false
